name: CI

# Gate every change into main: the build must pass AND no new Pixel token/component
# violations may be introduced. Make this a required status check so a red run blocks merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    name: Build + Pixel Police
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pixel Police — token/component check on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/pixel-police.mjs "origin/${{ github.base_ref }}"
          else
            node scripts/pixel-police.mjs "${{ github.event.before }}"
          fi
